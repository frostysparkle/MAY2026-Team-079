[pytest]
# Run from `backend/`: `python -m pytest testing`
#
# `pythonpath = .` is what makes the suite importable at all: every router uses
# flat imports (`from database import ...`, `from models import ...`), so the
# `backend/` directory itself has to be on sys.path. Without this, collecting
# `testing/unit/routers/test_auth.py` fails at `import main`.
pythonpath = .
testpaths = testing

# `asyncio_mode = auto` so the SSE generator tests can be plain `async def`
# without each one carrying an explicit marker. The two streaming endpoints
# (workshops seats, events announcements) are the only async code in the app.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

addopts = -q --strict-markers

markers =
    slow: exercises full-cost cryptography (bcrypt / RSA-2048) or large fixtures
    integration: spans more than one router; lives under testing/integration

filterwarnings =
    default
    # `datetime.utcnow()` is deprecated from 3.12 onward and is used throughout
    # the application code. The suite deliberately does not treat that as an
    # error: changing it is an application change, not a test change.
    ignore:datetime.datetime.utcnow:DeprecationWarning

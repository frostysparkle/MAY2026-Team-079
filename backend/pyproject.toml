[project]
name = "backend"
version = "0.1.0"
description = "Backend for the MAY2026-Team-079 project"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cryptography>=49.0.0",
    "fastapi>=0.139.0",
    "pyjwt>=2.10.1",
    "pymongo>=4.17.0",
    "pyotp>=2.9.0",
    "redis>=8.0.1",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.4.0",
]

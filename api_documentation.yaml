          - type: 'null'
          title: Facility Type
      - name: facility_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Facility Id
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 100
          title: Limit

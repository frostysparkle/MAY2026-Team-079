  /workshops/{workshop_id}/participants/{participant_id}:
    patch:
      tags:
      - Workshops
      summary: Update Workshop Participant
      description: "Correct one participant's record for this workshop — attendance,\
        \ or how the\nseat was taken.\n\nWhy this exists: attendance could only ever\
        \ be set by a successful RSA-OAEP\nscan, so a flat battery, a cracked screen,\
        \ or a QR that expired in the queue\nleft a student who was visibly in the\
        \ room marked absent, with no way back.\nThis is the authorised correction,\
        \ and it is deliberately narrow.\n\nAuthorisation is stricter than the roster\
        \ above: a Super Admin, or a team\nmember **whose `attendance` flag is on**.\
        \ Writing attendance is the same\nprivilege as scanning it, so somebody stood\
        \ down from the door cannot set by\nhand what they are not allowed to scan.\n\
        \nBookkeeping:\n  * `participant_count` follows the change, and only on a\
        \ real transition, so\n    repeating the same correction cannot inflate the\
        \ count.\n  * `registration_count` is left alone. The seat was already counted\
        \ when the\n    booking was made; flipping `booking_type` re-labels that seat,\
        \ it does not\n    take another one.\n\nEvery call writes a `workshop_logs`\
        \ row and an audit entry naming the actor —\na hand-set attendance is exactly\
        \ the kind of record that must not be\nindistinguishable from a scan."
      operationId: update_workshop_participant_workshops__workshop_id__participants__participant_id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: workshop_id
        in: path
        required: true
        schema:
          type: string
          title: Workshop Id
      - name: participant_id
        in: path
        required: true
        schema:
          type: string
          title: Participant Id
      requestBody:
        required: true

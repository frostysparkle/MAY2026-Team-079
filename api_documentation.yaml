      - Issues
      summary: List Issues
      description: >-
        The reports this staff member is answerable for. A Super Admin sees every
        report in the fest; everybody else sees exactly the blocks and halls
        whose hostel_team or mess_team names them — the same membership test
        /hostels/{id}/scan and /mess/{id}/scan make, but deliberately not gated
        on the logging flag, since seeing a fault on your own block is not the
        same permission as working its turnstile. A staffer on no team gets an
        empty list, not a 403. Each row carries a reporter object with the
        participant's id, name, phone and room, so the team can call them back —
        the same profile fields /hostels/{id}/statistics and
        /mess/{id}/statistics already hand to staff. status, facility_type and
        facility_id narrow the list; an unrecognised status is a 400 rather than
        a filter that silently matches nothing.

      summary: Create Embedding
      description: >-
        Text to embedding vector(s), proxied to whatever OpenAI-compatible
        provider this deployment is configured for. Configuration follows
        the openai Python client's own parameters — api key, base url,
        organization, project, timeout, max retries — read from the
        EMBEDDINGS_* (falling back to OPENAI_*) environment variables, so
        the same endpoint can point at OpenAI's API or a locally hosted
        OpenAI-compatible server (Ollama, LM Studio, vLLM,
        text-embeddings-inference, ...) purely by changing configuration.
        Request and response shapes match the openai library's
        client.embeddings.create(...) exactly, so any OpenAI SDK client can
        call this endpoint as a drop-in. Requires authentication (participant
        or staff) and is rate limited to one call per user per minute.

            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  query_id:
                    type: string
                  query:
                    type: string
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Queries
      summary: List Queries
      description: 'The shared queue — Story 6.3, and the source for the operational

        dashboard''s open-queries and hostel-issues panels (Story 9.1).


        Not scoped by entity any more: a Super Admin and every member of the query

        resolution team see the same unrestricted queue, across every category

        including ``general``, resolved queries included — a query team member can

        self-claim any of it by ``PATCH``-ing ``assigned_to`` to their own id. A

        staff member who is on neither gets a 403; there is no per-entity scope

        left to fall back to an empty result with.


        ``status`` and ``category`` filter server-side for the same reason

        ``/audit-logs`` does: ``limit`` applies before any client-side filter could.'
      operationId: list_queries_queries_get
      security:
      - HTTPBearer: []
      parameters:
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
      - name: category
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Category
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          default: 100
          title: Limit
      responses:
        '401':
          description: Invalid or expired token, or user not found
        '403':
          description: Insufficient permissions or wrong token type
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /queries/mine:
    get:
      tags:
      - Queries
      summary: My Queries
      description: 'Track your own queries — Story 6.2. Newest first, replies included,
        so the

        participant sees the status *and* what was said about it.


        Declared before ``/{query_id}`` so the literal path is not captured as an
        id.'
      operationId: my_queries_queries_mine_get
      responses:
        '401':
          description: Invalid or expired token, or user not found
        '403':
          description: Insufficient permissions or wrong token type
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /queries/{query_id}:
    patch:
      tags:
      - Queries
      summary: Update Query
      description: 'Set status and assignment — Story 6.3.


        Only the fields a request carries are written, so a screen that reassigns
        a

        query cannot blank its status on the way past. A query team member sets

        ``assigned_to`` to their own id to self-claim a query; a Super Admin may

        assign to anyone.'
      operationId: update_query_queries__query_id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: query_id
        in: path
        required: true
        schema:
          type: string
          title: Query Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryUpdateRequest'
      responses:
        '401':
          description: Invalid or expired token, or user not found
        '403':
          description: Insufficient permissions or wrong token type
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  query:
                    type: string
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '404':
          description: Entity not found
  /queries/{query_id}/replies:
    post:
      tags:
      - Queries
      summary: Reply To Query
      description: "The conversation — Story 6.4, and the half of 6.2 that makes a\
        \ status useful.\n\nTakes either token type: the participant who raised it\
        \ and a query team\nmember write to the same thread. Nobody else can read\
        \ or write it, which is\nchecked per-role rather than per-token, so a staff\
        \ member off the query\nteam is refused even though their token is valid.\n\
        \nNeither refusal discloses whether the id exists. The route used to look\
        \ the\nquery up and 404 first, so any authenticated user could tell a real\
        \ query id\nfrom an invented one — and these threads hold participants' free\
        \ text, the one\nplace in this API where a student writes something another\
        \ user reads back.\nThe two sides get there differently, because their refusals\
        \ are different\nkinds of thing:\n\n  * a staff member off the query team\
        \ may handle *no* query, so which one was\n    asked for never enters into\
        \ it. Refused before the lookup, exactly as\n    `update_query` and every\
        \ other staff-side route here already does.\n  * a participant may only handle\
        \ their *own*, which cannot be decided without\n    the document. So \"not\
        \ yours\" and \"not there\" collapse into the same 404:\n    for a participant,\
        \ no other query exists — the same thing `GET\n    /queries/mine` says by\
        \ omitting it from the list."
      operationId: reply_to_query_queries__query_id__replies_post
      security:
      - HTTPBearer: []
      parameters:
      - name: query_id
        in: path
        required: true
        schema:
          type: string
          title: Query Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryReplyRequest'
      responses:
        '401':
          description: Invalid or expired token, or user not found
        '403':
          description: Insufficient permissions or wrong token type
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  reply:
                    type: string
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '404':
          description: Entity not found
  /queries/team:
    get:
      tags:
      - Queries
      summary: List Query Team
      description: The current roster — Super Admin only, same as `event_team` details
        are staff-gated.
      operationId: list_query_team_queries_team_get
      responses:
        '401':
          description: Invalid or expired token, or user not found
        '403':
          description: Insufficient permissions or wrong token type
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
    post:
      tags:
      - Queries
      summary: Add Query Team Member
      description: 'Add a staff member to the query resolution team — Super Admin
        only.


        `user_id` must already exist in `backend_teams_collection`; this roster

        grants query access on top of an existing staff account, it does not

        create one.'
      operationId: add_query_team_member_queries_team_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryTeamAssignRequest'
        required: true
      responses:
        '401':
          description: Invalid or expired token, or user not found
        '403':
          description: Insufficient permissions or wrong token type
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  member:
                    type: string
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /queries/team/{user_id}:
    delete:
      tags:
      - Queries
      summary: Remove Query Team Member
      description: Frees this person from query duty. Does not touch anything they
        already replied to or were assigned.
      operationId: remove_query_team_member_queries_team__user_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          title: User Id
      responses:
        '401':
          description: Invalid or expired token, or user not found
        '403':
          description: Insufficient permissions or wrong token type
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '404':
          description: Entity not found
  /issues:
    post:
      tags:
      - Issues
      summary: Report Issue
      description: 'File a hostel or mess fault — Story 5.4. Participants only, and
        only against

        the facility they are actually placed in: a hostel report requires

        accommodation.hostel_id to match, a mess report requires mess.mess_id to

        match, otherwise 403. The facility must exist (404 otherwise) and the

        category must be one the facility type has (400 otherwise). A participant
        may

        hold at most 10 unresolved reports per facility; resolving one frees a slot.

        Status starts at open. Audited as ISSUE_REPORT against the facility id.


        Declared before `/{issue_id}` routes so nothing literal is captured as an
        id.'
      operationId: report_issue_issues_post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueCreateRequest'
      responses:
        '401':
          description: Invalid or expired token, or user not found
        '403':
          description: Insufficient permissions or wrong token type
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  issue_id:
                    type: string
                  status:
                    type: string
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Issues
      summary: List Issues
      description: 'The reports this staff member is answerable for.


        A Super Admin sees every report in the fest; everybody else sees exactly the

        blocks and halls whose hostel_team or mess_team names them — the same

        membership test /hostels/{id}/scan and /mess/{id}/scan make, but deliberately

        not gated on the logging flag, since seeing a fault on your own block is not

        the same permission as working its turnstile. A staffer on no team gets an

        empty list, not a 403 — having no duty is not an authorization failure, and
        a

        console that errors at a volunteer between postings reads as a bug.


        Each row carries a reporter object with the participant''s id, name, phone
        and

        room, so the team can call them back. status, facility_type and facility_id

        narrow the list; an unrecognised status is a 400 rather than a filter that

        silently matches nothing.'
      operationId: list_issues_issues_get
      security:
      - HTTPBearer: []
      parameters:
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
      - name: facility_type
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Facility Type
      - name: facility_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Facility Id
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          default: 100
          title: Limit
      responses:
        '401':
          description: Invalid or expired token, or user not found
        '403':
          description: Insufficient permissions or wrong token type
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: string
                  issues:
                    type: string
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /issues/mine:
    get:
      tags:
      - Issues
      summary: My Issues
      description: 'Every report this participant has filed, newest first, each with
        the status

        history that makes the story trackable rather than a write-only suggestion

        box. Returns {count, issues}. An update''s note is included; which volunteer

        wrote it is not — that is staff bookkeeping and the audit trail keeps it.
        No

        other reporter''s details appear here.


        Declared before `/{issue_id}` so the literal path is not captured as an id.'
      operationId: my_issues_issues_mine_get
      responses:
        '401':
          description: Invalid or expired token, or user not found
        '403':
          description: Insufficient permissions or wrong token type
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: string
                  issues:
                    type: string
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /issues/{issue_id}:
    patch:
      tags:
      - Issues
      summary: Update Issue
      description: 'Move a report along, and say something the reporter will read.


        Scoped identically to GET /issues — only a Super Admin or somebody on that

        facility''s own team may answer for it, so the reporter cannot resolve their

        own report. Every call appends to `updates` rather than overwriting, so a

        participant sees the history rather than only the latest word. A note with
        no

        status change is valid; an empty body is a 400, as is a status outside

        open | in_progress | resolved. Audited as ISSUE_UPDATE against the facility

        id.


        The report is resolved and the caller authorised before the body is judged.

        The other order reported the body''s shape for an issue that was not there
        —

        "Provide a status, a note, or both" against `ISS-NOPE` — which sends whoever

        is debugging it to look at their payload when the id is what is wrong. Same

        reason `update_participant_team` and `update_query` check existence first.'
      operationId: update_issue_issues__issue_id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: issue_id
        in: path
        required: true
        schema:
          type: string
          title: Issue Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueUpdateRequest'
      responses:
        '401':
          description: Invalid or expired token, or user not found
        '403':
          description: Insufficient permissions or wrong token type
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  issue_id:
                    type: string
                  status:
                    type: string
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '404':
          description: Entity not found
components:
  schemas:
    AnnouncementCreateRequest:
      properties:
        message:
          type: string
          minLength: 1
          title: Message
        priority:
          type: string
          enum:
          - low
          - mid
          - high
          title: Priority
          default: mid
      type: object
      required:
      - message
      title: AnnouncementCreateRequest
    BackendTeamCreateRequest:
      properties:
        email:
          type: string
          format: email
          title: Email
        password:
          type: string
          minLength: 8
          title: Password
        role:
          type: string
          enum:
          - super_admin
          - admin
          - other
          - volunteer
          title: Role
        department:
          type: string
          enum:
          - technical
          - sports
          - culturals
          - uhc
          - hostels
          - mess
          - workshops
          title: Department
        designation:
          type: string
          minLength: 1
          title: Designation
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
      type: object
      required:
      - email
      - password
      - role
      - department
      - designation
      title: BackendTeamCreateRequest
    BackendTeamUpdateRequest:
      properties:
        designation:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
          title: Designation
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
      type: object
      title: BackendTeamUpdateRequest
      description: '`role` and `department` are deliberately absent: both drive the

        `paradox_id` prefix assigned at creation and are treated as immutable —

        changing either means deleting the account and creating a new one, not

        patching this one. See `create_backend_team` / `update_backend_team`.'
    ChangePasswordRequest:
      properties:
        current_password:
          type: string
          title: Current Password
        new_password:
          type: string
          minLength: 8
          title: New Password
      type: object
      required:
      - current_password
      - new_password
      title: ChangePasswordRequest
    EmbeddingRequest:
      properties:
        input:
          anyOf:
          - type: string
          - items:
              type: string
            type: array
          title: Input
        model:
          anyOf:
          - type: string
          - type: 'null'
          title: Model
        encoding_format:
          anyOf:
          - type: string
          - type: 'null'
          title: Encoding Format
        dimensions:
          anyOf:
          - type: integer
          - type: 'null'
          title: Dimensions
        user:
          anyOf:
          - type: string
          - type: 'null'
          title: User
      type: object
      required:
      - input
      title: EmbeddingRequest
    EmergencyContact:
      properties:
        name:
          type: string
          title: Name
        relation:
          type: string
          title: Relation
        phone:
          type: string
          title: Phone
      type: object
      required:
      - name
      - relation
      - phone
      title: EmergencyContact
    EventCreateRequest:
      properties:
        event_type:
          type: string
          enum:
          - technical
          - culturals
          - sports
          - others
          title: Event Type
        name:
          type: string
          minLength: 1
          title: Name
        description:
          type: string
          minLength: 1
          title: Description
        poster:
          anyOf:
          - type: string
          - type: 'null'
          title: Poster
          default: ''
        team:
          $ref: '#/components/schemas/TeamRule'
        prize_money:
          items:
            $ref: '#/components/schemas/PrizeMoney'
          type: array
          title: Prize Money
          default: []
        registration:
          $ref: '#/components/schemas/RegistrationWindow'
        schedule:
          items:
            $ref: '#/components/schemas/ScheduleRound'
          type: array
          title: Schedule
          default: []
        registration_fields:
          items:
            $ref: '#/components/schemas/RegistrationField'
          type: array
          title: Registration Fields
          default: []
      type: object
      required:
      - event_type
      - name
      - description
      - team
      - registration
      title: EventCreateRequest
    EventRegistrationInput:
      properties:
        team_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Team Name
        team_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Team Id
        registration_data:
          additionalProperties: true
          type: object
          title: Registration Data
          default: {}
      type: object
      title: EventRegistrationInput
      description: "How a participant registers for an event: solo, creating a new\
        \ team, or\njoining one that already exists. Exactly one of these three —\
        \ never a\nteam_name *and* a team_id together, since that would be asking\
        \ to both\ncreate and join in the same request.\n\n- Leave both fields unset\
        \ to register solo.\n- Set `team_name` to create a new team and become its\
        \ leader. The\n  backend assigns that team's `team_id` — the same way `event_id`\
        \ and\n  `round_id` are assigned, via `id_generator.EventIDGenerator` — and\n\
        \  returns it in the response. Share that id with teammates so they can\n\
        \  join; the raw `team_name` text is never itself used as the id.\n- Set `team_id`\
        \ to the id returned when the team was created, to join\n  that existing team\
        \ as a member.\n\nWhether solo registration or team registration is required/allowed\
        \ for a\ngiven event is governed by that event's `team.max` and\n`team.allow_single_registration`\
        \ — enforced in the route, not here, since\nit depends on the event being\
        \ registered for."
    EventTeamAssignRequest:
      properties:
        user_id:
          type: string
          minLength: 1
          title: User Id
        role:
          type: string
          enum:
          - event_head
          - member
          - volunteer
          title: Role
      type: object
      required:
      - user_id
      - role
      title: EventTeamAssignRequest
    EventTeamRoleUpdateRequest:
      properties:
        role:
          type: string
          enum:
          - event_head
          - member
          - volunteer
          title: Role
      type: object
      required:
      - role
      title: EventTeamRoleUpdateRequest
    EventUpdateRequest:
      properties:
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        poster:
          anyOf:
          - type: string
          - type: 'null'
          title: Poster
        team:
          anyOf:
          - $ref: '#/components/schemas/TeamRule'
          - type: 'null'
        prize_money:
          anyOf:
          - items:
              $ref: '#/components/schemas/PrizeMoney'
            type: array
          - type: 'null'
          title: Prize Money
        registration:
          anyOf:
          - $ref: '#/components/schemas/RegistrationWindowUpdate'
          - type: 'null'
        schedule:
          anyOf:
          - items:
              $ref: '#/components/schemas/ScheduleRound'
            type: array
          - type: 'null'
          title: Schedule
        registration_fields:
          anyOf:
          - items:
              $ref: '#/components/schemas/RegistrationField'
            type: array
          - type: 'null'
          title: Registration Fields
      type: object
      title: EventUpdateRequest
    ForgotPasswordRequest:
      properties:
        email:
          type: string
          format: email
          title: Email
      type: object
      required:
      - email
      title: ForgotPasswordRequest
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HostelAssignTeamRequest:
      properties:
        user_id:
          type: string
          title: User Id
        role:
          type: string
          title: Role
        attendance:
          type: boolean
          title: Attendance
          default: true
      type: object
      required:
      - user_id
      - role
      title: HostelAssignTeamRequest
    HostelCreateRequest:
      properties:
        name:
          type: string
          title: Name
        capacity:
          type: integer
          exclusiveMinimum: 0.0
          title: Capacity
        gender:
          type: string
          title: Gender
        sharing:
          type: integer
          exclusiveMinimum: 0.0
          title: Sharing
          description: Max occupants per room
        num_rooms:
          type: integer
          exclusiveMinimum: 0.0
          title: Num Rooms
          description: Number of rooms to pre-generate
      type: object
      required:
      - name
      - capacity
      - gender
      - sharing
      - num_rooms
      title: HostelCreateRequest
    HostelUpdateRequest:
      properties:
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        capacity:
          anyOf:
          - type: integer
            exclusiveMinimum: 0.0
          - type: 'null'
          title: Capacity
      type: object
      title: HostelUpdateRequest
      description: 'Every field optional: a caller updates only what it names.
        `gender` and the rooming fields (`sharing`, `num_rooms`) are deliberately
        absent — they cannot be changed after a hostel block is created.'
    IssueCreateRequest:
      properties:
        facility_type:
          type: string
          title: Facility Type
          description: hostel | mess
        facility_id:
          type: string
          title: Facility Id
          description: A readable hostel_id or mess_id, never an ObjectId. Must be
            the facility this participant is actually placed in.
        category:
          type: string
          title: Category
          description: For a hostel — water | electricity | cleanliness | furniture
            | internet | safety | noise | other. For a mess — food_quality | hygiene
            | service | timing | dietary | other. Validated, because the answering
            team's console groups and labels by it.
        subject:
          type: string
          maxLength: 120
          minLength: 3
          title: Subject
        body:
          type: string
          maxLength: 2000
          minLength: 3
          title: Body
        room:
          anyOf:
          - type: string
          - type: 'null'
          title: Room
          description: Where the fault is. Defaults to the room the participant is
            allotted, so the common case needs no typing.
      type: object
      required:
      - facility_type
      - facility_id
      - category
      - subject
      - body
      title: IssueCreateRequest
    IssueUpdateRequest:
      properties:
        status:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
          description: open | in_progress | resolved
        note:
          anyOf:
          - type: string
            maxLength: 2000
          - type: 'null'
          title: Note
          description: A line the reporter will read. Valid on its own, with no status
            change — "we have ordered the part" is worth saying.
      type: object
      title: IssueUpdateRequest
    LoginRequest:
      properties:
        email:
          type: string
          format: email
          title: Email
        password:
          type: string
          title: Password
      type: object
      required:
      - email
      - password
      title: LoginRequest
    MessAssignTeamRequest:
      properties:
        user_id:
          anyOf:
          - type: string
          - type: 'null'
          title: User Id
        role:
          type: string
          title: Role
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        phone:
          anyOf:
          - type: string
          - type: 'null'
          title: Phone
      type: object
      required:
      - role
      title: MessAssignTeamRequest
    MessCreateRequest:
      properties:
        mess_id:
          type: string
          title: Mess Id
        name:
          type: string
          title: Name
        capacity:
          type: integer
          exclusiveMinimum: 0.0
          title: Capacity
        type:
          type: string
          title: Type
      type: object
      required:
      - mess_id
      - name
      - capacity
      - type
      title: MessCreateRequest
    MessMealSlot:
      properties:
        start_time:
          type: string
          format: date-time
          title: Start Time
        end_time:
          type: string
          format: date-time
          title: End Time
        menu:
          type: string
          minLength: 1
          title: Menu
      type: object
      required:
      - start_time
      - end_time
      - menu
      title: MessMealSlot
      description: 'One meal sitting on one day: when it runs, and what it serves.'
    MessMenuRequest:
      properties:
        menu:
          additionalProperties:
            additionalProperties:
              $ref: '#/components/schemas/MessMealSlot'
            type: object
          type: object
          title: Menu
          default: {}
      type: object
      title: MessMenuRequest
      description: 'A full replacement for a hall''s `menu`.


        Keyed exactly as it is stored: `day_1`, `day_2`, ... each holding whichever

        of `breakfast` / `lunch` / `dinner` that day actually serves. A day need

        not carry all three — this is what lets an admin give a travel day

        breakfast only, and how many days there are is entirely up to them.


        A full replacement rather than a per-day patch: it keeps one write path

        for "add a day", "drop a slot", or "move a sitting", instead of three.'
    MessUpdateRequest:
      properties:
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        capacity:
          anyOf:
          - type: integer
            exclusiveMinimum: 0.0
          - type: 'null'
          title: Capacity
        type:
          anyOf:
          - type: string
          - type: 'null'
          title: Type
      type: object
      title: MessUpdateRequest
      description: 'Every field optional: a caller updates only what it names.'
    MockPaymentRequest:
      properties:
        method:
          anyOf:
          - type: string
          - type: 'null'
          title: Method
          default: upi
      type: object
      title: MockPaymentRequest
      description: 'A mock payment attempt for the mess or hostel fee (`POST /mess/pay`,

        `POST /hostels/pay`).


        The amount is never accepted from the client — each route charges its own

        fixed fee, so a participant cannot pay an arbitrary amount — so this model

        carries only the payment method, which exists purely to label the mock

        receipt the same way `StayPaymentPage`''s frontend mock does.'
    ParticipantAdminUpdateRequest:
      properties:
        full_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Full Name
        house:
          anyOf:
          - type: string
          - type: 'null'
          title: House
        gender:
          anyOf:
          - type: string
          - type: 'null'
          title: Gender
        phone:
          anyOf:
          - type: string
          - type: 'null'
          title: Phone
        mess_preference:
          anyOf:
          - type: string
          - type: 'null'
          title: Mess Preference
        country:
          anyOf:
          - type: string
          - type: 'null'
          title: Country
        state:
          anyOf:
          - type: string
          - type: 'null'
          title: State
        city:
          anyOf:
          - type: string
          - type: 'null'
          title: City
        address:
          anyOf:
          - type: string
          - type: 'null'
          title: Address
        program:
          anyOf:
          - type: string
          - type: 'null'
          title: Program
        course_stage:
          anyOf:
          - type: string
          - type: 'null'
          title: Course Stage
        emergency_contact:
          anyOf:
          - $ref: '#/components/schemas/EmergencyContact'
          - type: 'null'
      type: object
      title: ParticipantAdminUpdateRequest
    PrizeMoney:
      properties:
        position:
          type: string
          minLength: 1
          title: Position
        amount:
          type: integer
          minimum: 0.0
          title: Amount
      type: object
      required:
      - position
      - amount
      title: PrizeMoney
    ProfileCompleteRequest:
      properties:
        full_name:
          type: string
          title: Full Name
        dob:
          type: string
          title: Dob
        house:
          type: string
          title: House
        gender:
          type: string
          title: Gender
        phone:
          type: string
          title: Phone
        mess_preference:
          anyOf:
          - type: string
          - type: 'null'
          title: Mess Preference
        country:
          type: string
          title: Country
        state:
          type: string
          title: State
        city:
          type: string
          title: City
        address:
          type: string
          title: Address
        emergency_contact:
          anyOf:
          - $ref: '#/components/schemas/EmergencyContact'
          - type: 'null'
        program:
          type: string
          title: Program
        course_stage:
          type: string
          title: Course Stage
        photo:
          anyOf:
          - type: string
          - type: 'null'
          title: Photo
        event_preferences:
          anyOf:
          - type: string
          - type: 'null'
          title: Event Preferences
      type: object
      required:
      - full_name
      - dob
      - house
      - gender
      - phone
      - country
      - state
      - city
      - address
      - program
      - course_stage
      title: ProfileCompleteRequest
    QueryCreateRequest:
      properties:
        category:
          type: string
          title: Category
        subject:
          type: string
          minLength: 1
          title: Subject
        body:
          type: string
          minLength: 1
          title: Body
        target_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Target Id
      type: object
      required:
      - category
      - subject
      - body
      title: QueryCreateRequest
    QueryReplyRequest:
      properties:
        body:
          type: string
          minLength: 1
          title: Body
      type: object
      required:
      - body
      title: QueryReplyRequest
    QueryTeamAssignRequest:
      properties:
        user_id:
          type: string
          minLength: 1
          title: User Id
      type: object
      required:
      - user_id
      title: QueryTeamAssignRequest
      description: 'Adds an existing backend_teams member to the flat query resolution

        team roster (see routers/queries.py).'
    QueryUpdateRequest:
      properties:
        status:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
        assigned_team:
          anyOf:
          - type: string
          - type: 'null'
          title: Assigned Team
        assigned_to:
          anyOf:
          - type: string
          - type: 'null'
          title: Assigned To
      type: object
      title: QueryUpdateRequest
    RegisterRequest:
      properties:
        email:
          type: string
          format: email
          title: Email
        password:
          type: string
          minLength: 8
          title: Password
      type: object
      required:
      - email
      - password
      title: RegisterRequest
    RegistrationField:
      properties:
        field_id:
          type: string
          minLength: 1
          title: Field Id
        label:
          type: string
          minLength: 1
          title: Label
        type:
          type: string
          title: Type
        required:
          type: boolean
          title: Required
          default: true
      type: object
      required:
      - field_id
      - label
      - type
      title: RegistrationField
    RegistrationWindow:
      properties:
        start_time:
          type: string
          title: Start Time
        end_time:
          type: string
          title: End Time
        allowed:
          type: boolean
          title: Allowed
          default: true
      type: object
      required:
      - start_time
      - end_time
      title: RegistrationWindow
      description: 'When an event accepts registrations, and the manual kill-switch
        beside it.


        `allowed` is a Super Admin override, independent of the time window: the

        effective open/closed state an API response reports is

        ``allowed AND now within [start_time, end_time]`` (see

        ``events._registration_open``). Neither bound is optional — an event with

        no window has no reliable answer to "is registration open", which is the

        ambiguity that used to be papered over by a bare ``open: bool``.'
    RegistrationWindowUpdate:
      properties:
        start_time:
          anyOf:
          - type: string
          - type: 'null'
          title: Start Time
        end_time:
          anyOf:
          - type: string
          - type: 'null'
          title: End Time
        allowed:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Allowed
      type: object
      title: RegistrationWindowUpdate
      description: 'Same as `RegistrationWindow`, but every field optional so `PUT

        /events/{id}` can flip just `allowed` without having to resend the window.'
    ResetPasswordRequest:
      properties:
        token:
          type: string
          title: Token
        new_password:
          type: string
          minLength: 8
          title: New Password
      type: object
      required:
      - token
      - new_password
      title: ResetPasswordRequest
    ScanQRRequest:
      properties:
        participant_id:
          type: string
          title: Participant Id
        data:
          type: string
          title: Data
        timestamp:
          type: string
          title: Timestamp
      type: object
      required:
      - participant_id
      - data
      - timestamp
      title: ScanQRRequest
    ScheduleRound:
      properties:
        round_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Round Id
        name:
          type: string
          minLength: 1
          title: Name
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
          default: ''
        start_time:
          type: string
          title: Start Time
        end_time:
          type: string
          title: End Time
        venue:
          anyOf:
          - type: string
          - type: 'null'
          title: Venue
      type: object
      required:
      - name
      - start_time
      - end_time
      title: ScheduleRound
    TeamRule:
      properties:
        min:
          type: integer
          minimum: 1.0
          title: Min
          default: 1
        max:
          type: integer
          minimum: 1.0
          title: Max
          default: 1
        house_vs_house_event:
          type: boolean
          title: House Vs House Event
          default: false
        allow_single_registration:
          type: boolean
          title: Allow Single Registration
          default: true
      type: object
      title: TeamRule
    TeamUpdateInput:
      properties:
        team_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Team Id
        team_role:
          anyOf:
          - type: string
            enum:
            - leader
            - member
          - type: 'null'
          title: Team Role
      type: object
      title: TeamUpdateInput
      description: 'A partial update: a head may move a participant without restating
        their role,

        or change the role without restating the team.


        Both fields default to ``None``, so "absent" and "explicitly null" look the

        same on the model — the route separates them with ``model_fields_set``

        instead. Only ``team_id`` is nullable in the data: clearing it takes the

        participant off their team, whereas a stored ``team_role`` is always one of

        `models.PARTICIPANT_TEAM_ROLES` — "leader" or "member".'
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    WorkshopAssignVolunteerRequest:
      properties:
        user_id:
          type: string
          title: User Id
        role:
          type: string
          title: Role
          default: workshop_volunteer
        attendance:
          type: boolean
          title: Attendance
          default: true
      type: object
      required:
      - user_id
      title: WorkshopAssignVolunteerRequest
    WorkshopCreateRequest:
      properties:
        slot_id:
          type: string
          pattern: ^D\d+S\d+$
          title: Slot Id
        name:
          type: string
          minLength: 1
          title: Name
        description:
          type: string
          minLength: 1
          title: Description
        venue:
          type: string
          minLength: 1
          title: Venue
        capacity:
          type: integer
          exclusiveMinimum: 0.0
          title: Capacity
        instructions:
          type: string
          minLength: 1
          title: Instructions
        registration_start:
          type: string
          title: Registration Start
        registration_end:
          type: string
          title: Registration End
        registration_open:
          type: boolean
          title: Registration Open
          default: true
      type: object
      required:
      - slot_id
      - name
      - description
      - venue
      - capacity
      - instructions
      - registration_start
      - registration_end
      title: WorkshopCreateRequest
    WorkshopParticipantUpdateRequest:
      properties:
        attended:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Attended
        booking_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Booking Type
      type: object
      title: WorkshopParticipantUpdateRequest
      description: 'An authorised correction to one participant''s record *for one
        workshop*.


        Both fields are optional so a caller sends only what changes; an empty body
        is

        rejected by the route rather than silently doing nothing.


        Deliberately scoped to the two fields the workshop owns on

        ``participants.workshops[]`` — whether they turned up, and whether the seat
        was

        booked ahead or taken at the door. Identity fields (name, email, phone, house,

        academic record) are *not* editable here: they belong to the participant,
        they

        are read by every other screen in the fest, and a workshop volunteer is not
        who

        should be rewriting them.'
    WorkshopSlotCreateRequest:
      properties:
        slot_id:
          type: string
          pattern: ^D\d+S\d+$
          title: Slot Id
        start_time:
          type: string
          title: Start Time
        end_time:
          type: string
          title: End Time
      type: object
      required:
      - slot_id
      - start_time
      - end_time
      title: WorkshopSlotCreateRequest
    WorkshopSlotUpdateRequest:
      properties:
        start_time:
          anyOf:
          - type: string
          - type: 'null'
          title: Start Time
        end_time:
          anyOf:
          - type: string
          - type: 'null'
          title: End Time
      type: object
      title: WorkshopSlotUpdateRequest
      description: 'Every field optional so a caller can push just one of the two
        — the route

        merges whatever is given onto the stored document before re-validating

        end > start, the same pattern `events.py` uses for `RegistrationWindowUpdate`.'
    WorkshopUpdateRequest:
      properties:
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        venue:
          anyOf:
          - type: string
          - type: 'null'
          title: Venue
        capacity:
          anyOf:
          - type: integer
            exclusiveMinimum: 0.0
          - type: 'null'
          title: Capacity
        instructions:
          anyOf:
          - type: string
          - type: 'null'
          title: Instructions
        registration_start:
          anyOf:
          - type: string
          - type: 'null'
          title: Registration Start
        registration_end:
          anyOf:
          - type: string
          - type: 'null'
          title: Registration End
        registration_open:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Registration Open
      type: object
      title: WorkshopUpdateRequest
      description: 'Every field optional so a caller updates only what it names. `slot_id`
        is

        deliberately absent: a workshop''s slot is fixed at creation because

        participants'' bookings reference it (same rule as before this restructure).

        `start_time` is likewise absent as a direct field — it only ever changes

        via a cascaded slot edit (`PUT /workshop-slots/{slot_id}`), never directly.'
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT

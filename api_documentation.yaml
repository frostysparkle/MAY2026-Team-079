  /participants/{participant_id}:
    patch:
      tags:
      - Participants
      summary: Update Participant
      description: "Edit another person's record — Story 7.3's missing write half.\n\
        \nSuper Admins only. Until this existed there was no endpoint anywhere that\n\
        wrote to a participant document other than the participant's own\n``PATCH\
        \ /profile/complete``, so an admin who spotted a misspelled name on a\nhostel\
        \ roster could do nothing about it.\n\nDeliberately narrow. Only ``profile``\
        \ fields are writable:\n\n* ``email`` and ``participant_id`` are identity\
        \ — ``participant_id`` is\n  derived from the email by ``generate_participant_id``\
        \ and is the key every\n  roster, log row, and QR payload joins on.\n* ``password_hash``\
        \ and ``qr_secrets`` are credentials.\n* ``mess`` / ``accommodation`` / ``events``\
        \ / ``workshops`` are owned by the\n  allocation and registration routes,\
        \ which enforce capacity and state. An\n  admin writing them directly would\
        \ put a participant in a hall with no seat\n  left, or mark them inside a\
        \ block the scanner thinks they left.\n\nEvery field is optional and only\
        \ the ones present are written, so a form that\nfixes a phone number cannot\
        \ blank an address."
      operationId: update_participant_participants__participant_id__patch
      security:

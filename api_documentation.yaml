        '404':
          description: Entity not found
      description: POST /workshops/{workshop_id}/attendance
  /workshops/{workshop_id}/participation:
    get:
      tags:
      - Workshops
      summary: Workshop Participation
      description: 'Who booked this workshop, who turned up, and what level they are
        at.


        The counterpart of `GET /events/{event_id}/participation`, and gated the same

        way: a Super Admin, **or** a member of this workshop''s own `workshop_team`.

        Any other staff account gets 403 — being staff somewhere is not being staff

        here. Participants have no route to this at all; the fullness figures they
        may

        read are the counts already on `GET /workshops`.


        A team member is authorised whether or not their `attendance` flag is on:
        that

        flag gates *scanning*, and a volunteer stood down from the door still needs
        to

        read the room''s own roster.


        `course_stage` and `academic_level` are the reason this returns more than
        the

        log ever could. They are the participant''s real academic standing, written
        by

        `PATCH /profile/complete` and by the student dataset, and they are what makes

        an "interest by level" breakdown a count rather than an inference from a roll

        number. Everything here is a projection of fields that already exist — no

        field is computed, stored, or derived.'
      operationId: workshop_participation_workshops__workshop_id__participation_get
      security:
      - HTTPBearer: []
      parameters:
      - name: workshop_id
        in: path
        required: true
        schema:
          type: string
          title: Workshop Id
      responses:
        '401':
          description: Invalid or expired token, or user not found
        '403':
          description: Insufficient permissions or wrong token type
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  workshop_id:
                    type: string
                  name:
                    type: string
                  venue:
                    type: string
                  slot_id:
                    type: string
                  start_time:
                    type: string
                  registration_start:
                    type: string
                  registration_end:
                    type: string
                  registration_open:
                    type: string
                  capacity:
                    type: string
                  registration_count:
                    type: string
                  participant_count:
                    type: string
                  count:
                    type: string
                  attended_count:
                    type: string

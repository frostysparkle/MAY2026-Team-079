openapi: 3.1.0
info:
  title: Paradox Connect API
  version: 0.1.0
paths:
  /profile/complete:
    patch:
      summary: Complete Profile
      operationId: complete_profile_profile_complete_patch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileCompleteRequest'
        required: true
      responses:
        '401':
          description: Invalid or expired token, or user not found
        '403':
          description: Insufficient permissions or wrong token type
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  full_name:
                    type: string
                  dob:
                    type: string
                  house:
                    type: string
                  gender:
                    type: string
                  phone:
                    type: string
                  mess_preference:
                    type: string
                  country:
                    type: string
                  state:
                    type: string
                  city:
                    type: string
                  address:
                    type: string
                  emergency_contact:
                    type: string
                  program:
                    type: string
                  course_stage:
                    type: string
                  event_preferences:
                    type: string
                  photo:
                    type: string
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
      tags:
      - Auth
      description: PATCH /profile/complete

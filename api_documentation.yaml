        against the facility they are actually placed in: a hostel report
        requires accommodation.hostel_id to match, a mess report requires
        mess.mess_id to match, otherwise 403. The facility must exist (404
        otherwise) and the category must be one the facility type has (400
        otherwise). A participant may hold at most 10 unresolved reports per
        facility; resolving one frees a slot. Status starts at open. Audited as
        ISSUE_REPORT against the facility id.

        only, matching /mess/{mess_id}/statistics and
        /hostels/{hostel_id}/statistics. Counts only — no name, email, phone,
        address, photo, or participant id leaves this endpoint, so a dashboard
        can read fest-wide totals without exposing a roster. total_registered is
        every account in the participants collection, which is what

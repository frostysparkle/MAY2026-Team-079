  /audit-logs/summary:
    get:
      tags:
      - Audit
      summary: Audit Log Summary
      description: 'Exact counts over the trail, with no row limit.


        `GET /audit-logs` takes a `limit`, which is right for a table but wrong for
        a

        total: the dashboard was reading `rows.length` off a capped page and labelling

        it "Recorded Actions", so a fest with more history than the cap silently

        reported the cap. Counting server-side is the only way for those figures to
        be

        totals rather than floors, and it costs one request instead of paging the

        whole trail into the browser.


        `actor_ids` is the distinct set, not a sample, which is what lets the caller

        answer "which staff acted in this window" exactly. It replaces intersecting

        the staff roster with whatever actors happened to appear in the newest N rows.


        `meals` is present only when the window could contain `MESS_SCAN` rows — that

        is, when `action` is unset or is `MESS_SCAN` — and is `null` otherwise, so
        a

        caller asking about hostel entries is not handed a meal count.'
      operationId: audit_log_summary_audit_logs_summary_get
      security:
      - HTTPBearer: []
      parameters:
      - name: target_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Target Id
      - name: action
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Action
      - name: since
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Since
      - name: until
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Until
      responses:
        '401':
          description: Invalid or expired token, or user not found
        '403':
          description: Insufficient permissions or wrong token type
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: string
                  by_action:
                    type: string
                  distinct_actors:
                    type: string
                  actor_ids:
                    type: string
                  meals:
                    type: string
                  window:
                    type: string
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /audit-logs:
    get:
      tags:
      - Audit
      summary: View Audit Logs
      description: 'The audit trail, newest first.


        ``target_id`` narrows the trail to one entity — an event, workshop, mess hall,

        or hostel block — which is what the dashboard''s per-entity log view reads.

        Filtering server-side rather than pulling the whole trail and sifting it in
        the

        client matters here: ``limit`` would otherwise silently cut off an entity''s

        older entries, because it applies before any client-side filter can run.


        ``action`` narrows to one kind of action, e.g. ``HOSTEL_ENTRY``. Both are

        optional, so the unfiltered call is unchanged.


        ``since`` and ``until`` are ISO 8601 instants bounding ``timestamp``, half-open

        so consecutive windows tile cleanly. They exist because "today" was previously

        approximated by fetching the newest N rows and filtering them in the browser,

        which makes any daily figure a floor the moment the fest produces more than
        N

        rows in a day. Filtering here removes the cap from the question entirely.

        ``GET /audit-logs/summary`` takes the same four filters and returns exact

        counts over them.


        Every entry carries a ``names`` map from each person id it mentions to that

        person''s name, so the client can show "Priya Raman" where it used to show

        ``BT1755…`` without knowing which collection an id belongs to. Entries written

        since names began being recorded already carry ``actor_name``; the map is
        what

        makes the entries written before that readable too. ``actor_id`` and

        ``details`` are unchanged, so exports and filters that key on ids still work.'
      operationId: view_audit_logs_audit_logs_get
      security:
      - HTTPBearer: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          default: 100
          title: Limit
      - name: target_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Target Id
      - name: action
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Action
      - name: since
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Since
      - name: until
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Until
      responses:
        '401':
          description: Invalid or expired token, or user not found
        '403':
          description: Insufficient permissions or wrong token type
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'

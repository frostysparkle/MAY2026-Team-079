      summary: List Participants
      description: >-
        The fest-wide participant roster — Story 7.3's read half. Super Admins
        only, matching every other roster in the API; a non-super-admin staff
        token is a 403 and a participant token is a 403. Kept separate from
        /participants/statistics on purpose: that endpoint stays roster-free so a
        dashboard showing fest-wide totals is never the thing that leaks a list
        of names. The projection is an allow-list, so password_hash and
        qr_secrets cannot leave here and a field added to the schema later stays
        private until it is named; photo and embedding are excluded for size.
        events and workshops come back as event_count and workshop_count — the
        per-entity roster endpoints already answer "which ones". q matches a
        participant id, email, or full name, case-insensitively, so one search
        box finds a person however the admin knows them. Returns
        {count, participants}.
      operationId: list_participants_participants_get
      security:
      - HTTPBearer: []
      parameters:
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Q
      - name: house
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: House
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 200
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /participants/{participant_id}:
    patch:
      tags:
      - Participants
      summary: Update Participant
      description: >-
        Edit another person's record — Story 7.3's write half, and the only route
        in the API that writes to a participant document other than that
        participant's own PATCH /profile/complete. Super Admins only. Deliberately
        narrow: only profile fields are writable. email and participant_id are
        identity — participant_id is derived from the email and is the key every
        roster, log row, and QR payload joins on. password_hash and qr_secrets are
        credentials. mess, accommodation, events and workshops belong to the
        allocation and registration routes, which enforce capacity and scan state;
        an admin writing them directly could seat somebody in a full hall or mark
        them inside a block the scanner thinks they left. Unknown keys are ignored
        rather than rejected, and only the fields a request carries are written, so
        a form that fixes a phone number cannot blank an address. An empty body is
        a 400 and an unknown participant a 404. Audited as UPDATE_PARTICIPANT
        against the participant id, naming the fields changed. Returns
        {message, profile}.
      operationId: update_participant_participants__participant_id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: participant_id
        in: path
        required: true
        schema:
          type: string
          title: Participant Id
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParticipantAdminUpdateRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /queries:
    post:
      tags:
      - Queries
      summary: Raise Query
      description: >-
        Raise a query — Story 6.1. Participants only; a staff token is a 403. The
        category decides who will be able to answer it: hostel | mess | event |
        workshop route to that entity's own team, general routes to the Super
        Admins. Every category but general must name a target_id, and that entity
        must exist — validated at write time, because a query accepted but routed
        to nobody would sit unanswered looking exactly like one nobody has got to
        yet. A general query's target_id is dropped rather than stored, so no
        team's scope filter can match it. The stored row carries the author's
        participant_id, name, and house, and deliberately no email or phone: the
        reply thread is the channel back, and a block's team cannot otherwise read
        contact details. Status starts at open. Audited as RAISE_QUERY against the
        new query id. Returns {message, query_id, query}.
      operationId: raise_query_queries_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryCreateRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
    get:
      tags:
      - Queries
      summary: List Queries
      description: >-
        The staff queue — Story 6.3, and the source the operational dashboard's
        open-queries panel reads (Story 9.1). Scoped to the caller: a Super Admin
        sees every query including general ones, and everybody else sees only the
        blocks, halls, events, and workshops whose team names them — the same
        membership test the scanners already make — plus anything assigned to them
        by name, which is what stops a reassignment losing the thread. A staff
        member on no team gets an empty list rather than a 403, because an empty
        queue is a real state. A participant token is a 403. status and category
        filter server-side, for the same reason /audit-logs does: limit applies
        before any client-side filter could. An unrecognised status is a 400.
      operationId: list_queries_queries_get
      security:
      - HTTPBearer: []
      parameters:
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
      - name: category
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Category
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 100
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /queries/mine:
    get:
      tags:
      - Queries
      summary: My Queries
      description: >-
        Track your own queries — Story 6.2. Newest first, replies included, so the
        participant sees the status and what was said about it rather than only
        that somebody has it. Returns a bare list; an author with none gets an
        empty one. Declared before /queries/{query_id} so the literal path is not
        captured as an id.
      operationId: my_queries_queries_mine_get
      security:
      - HTTPBearer: []
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /queries/{query_id}:
    patch:
      tags:
      - Queries
      summary: Update Query
      description: >-
        Set status and assignment — Story 6.3. Scoped identically to GET /queries:
        a Super Admin, somebody on the owning entity's team, or the current
        assignee. Only the fields a request carries are written, so a screen that
        reassigns a query cannot blank its status on the way past. Naming an
        assigned_to implies status assigned, and an explicit status in the same
        request still wins, so resolve-and-assign works. resolved_at is stamped
        server-side when status becomes resolved and cleared when it is reopened.
        An empty body is a 400, a status outside open | assigned | resolved is a
        400, and an unknown query is a 404. Audited as UPDATE_QUERY. Returns
        {message, query}.
      operationId: update_query_queries__query_id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: query_id
        in: path
        required: true
        schema:
          type: string
          title: Query Id
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryUpdateRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /queries/{query_id}/replies:
    post:
      tags:
      - Queries
      summary: Reply To Query
      description: >-
        The conversation — Story 6.4, and the half of 6.2 that makes a status
        useful. Takes either token type: the participant who raised the query and
        the staff member handling it write to the same thread. Nobody else can,
        and the check is per-role rather than per-token-type, so a staff member
        outside the owning team is refused even though their token is valid, and
        another participant gets "Not your query". Replies append in order and
        carry author_type participant | staff with a display name. Audited as
        REPLY_QUERY. Returns {message, reply}.
      operationId: reply_to_query_queries__query_id__replies_post
      security:
      - HTTPBearer: []
      parameters:
      - name: query_id
        in: path
        required: true
        schema:
          type: string
          title: Query Id
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryReplyRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'

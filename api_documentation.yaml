    QueryUpdateRequest:
      properties:
        status:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
          description: open | assigned | resolved
        assigned_team:
          anyOf:
          - type: string
          - type: 'null'
          title: Assigned Team
          description: >-
            A label for the humans reading the thread, e.g. "Ganga Block desk".
            Routing is derived from category and target_id, so this grants nothing.
        assigned_to:
          anyOf:
          - type: string
          - type: 'null'
          title: Assigned To
          description: >-
            The paradox_id of the staff member who owns it. Setting it implies
            status assigned, and keeps the query readable by that person even if
            they are later taken off the team it came from.

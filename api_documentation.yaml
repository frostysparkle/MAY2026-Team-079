  /workshops/{workshop_id}/volunteers/{user_id}/toggle_scan:
    put:
      tags:
      - Workshops
      summary: Toggle Volunteer Scan
      description: 'Switch a volunteer''s desk scanning on or off.


        The volunteer is named by the `{user_id}` path segment — as the path always

        advertised, and as the sibling `DELETE .../volunteers/{user_id}` already did.

        The handler used to read a `volunteer_user_id` parameter that appears nowhere

        in the path, so FastAPI made it a *required query* parameter: the RESTful
        call

        the route documents was a 422, and the volunteer had to be repeated in the

        query string instead.


        A filter matching nothing is a 404. It used to answer 200 "Volunteer scanning

        toggled" with `applied: false` buried in the audit row, so an admin who

        believed they had just re-enabled somebody had changed nothing, and found
        out

        when that volunteer was refused at the desk.'
      operationId: toggle_volunteer_scan_workshops__workshop_id__volunteers__user_id__toggle_scan_put
      security:
      - HTTPBearer: []
      parameters:
      - name: workshop_id
        in: path
        required: true
        schema:
          type: string
          title: Workshop Id
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          title: User Id
      - name: attendance
        in: query
        required: true
        schema:
          type: boolean
          title: Attendance
      responses:
        '401':
          description: Invalid or expired token, or user not found
        '403':
          description: Insufficient permissions or wrong token type
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '404':
          description: Entity not found

        profile_complete / profile_incomplete, the mess and hostel funnel
        (mess_registered, mess_allotted, hostel_registered, hostel_allotted,
        hostel_pending, currently_on_campus), with_event_registrations,
        with_workshop_registrations, the by_house / by_program /
        by_course_stage / by_gender splits, and signups_by_day keyed
        chronologically by YYYY-MM-DD.

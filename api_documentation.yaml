    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HostelAssignTeamRequest:
      properties:
        user_id:
          anyOf:
          - type: string
          - type: 'null'
          title: User Id
        role:
          type: string
          title: Role
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        phone:
          anyOf:
          - type: string
          - type: 'null'
          title: Phone
      type: object
      required:
      - role
      title: HostelAssignTeamRequest
    HostelCreateRequest:
      properties:
        hostel_id:
          type: string
          title: Hostel Id
        name:
          type: string
          title: Name
        capacity:
          type: integer
          title: Capacity
        gender:
          type: string
          title: Gender
        coordinator:
          additionalProperties: true
          type: object
          title: Coordinator
      type: object
      required:
      - hostel_id
      - name
      - capacity
      - gender
      - coordinator
      title: HostelCreateRequest
    IssueCreateRequest:
      properties:
        facility_type:
          type: string
          title: Facility Type
          description: hostel | mess
        facility_id:
          type: string
          title: Facility Id
          description: >-
            A readable hostel_id or mess_id, never an ObjectId. Must be the
            facility this participant is actually placed in.
        category:
          type: string
          title: Category
          description: >-
            For a hostel — water | electricity | cleanliness | furniture |
            internet | safety | noise | other. For a mess — food_quality |
            hygiene | service | timing | dietary | other. Validated, because the
            answering team's console groups and labels by it.
        subject:
          type: string
          maxLength: 120
          minLength: 3
          title: Subject
        body:
          type: string
          maxLength: 2000
          minLength: 3
          title: Body
        room:
          anyOf:
          - type: string
          - type: 'null'
          title: Room
          description: >-
            Where the fault is. Defaults to the room the participant is allotted,
            so the common case needs no typing.
      type: object
      required:
      - facility_type
      - facility_id
      - category
      - subject
      - body
      title: IssueCreateRequest
    IssueUpdateRequest:
      properties:
        status:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
          description: open | in_progress | resolved
        note:
          anyOf:
          - type: string
            maxLength: 2000
          - type: 'null'
          title: Note
          description: >-
            A line the reporter will read. Valid on its own, with no status
            change — "we have ordered the part" is worth saying.
      type: object
      title: IssueUpdateRequest
    LoginRequest:
      properties:
        email:
          type: string
          format: email
          title: Email
        password:
          type: string
          title: Password
      type: object
      required:
      - email
      - password
      title: LoginRequest
    MessAssignTeamRequest:
      properties:
        user_id:
          anyOf:
          - type: string
          - type: 'null'
          title: User Id
        role:
          type: string
          title: Role
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        phone:
          anyOf:
          - type: string
          - type: 'null'
          title: Phone
      type: object
      required:
      - role
      title: MessAssignTeamRequest
    MessCreateRequest:
      properties:
        mess_id:
          type: string
          title: Mess Id
        name:
          type: string
          title: Name
        capacity:
          type: integer
          title: Capacity
        preference:
          type: string
          title: Preference
          description: >-
            Dietary designation: veg | non_veg | jain. POST /mess/allocate groups
            halls by this value and matches it against a participant's
            profile.mess_preference.
        cuisines:
          type: array
          items:
            type: string
          title: Cuisines
          default: []
          description: >-
            Regional menus the hall serves: north_indian | south_indian. A list,
            because a hall can serve both. Independent of preference, and not read
            by allocation.
      type: object
      required:
      - mess_id
      - name
      - capacity
      - preference
      title: MessCreateRequest
    MessMenuSlot:
      properties:
        slot:
          type: string
          title: Slot
          description: >-
            breakfast | lunch | dinner. The same three values POST
            /mess/{mess_id}/scan takes, so a sitting this hall serves is a sitting
            a swipe can be counted against. There is no fourth value, so snacks
            cannot be published here.
        start_time:
          type: string
          title: Start Time
          description: '24-hour HH:MM. The scanner reads these windows to work out
            which meal a swipe is logging, so changing one changes what a swipe
            counts as.'
        end_time:
          type: string
          title: End Time
          description: 24-hour HH:MM. Must come after start_time; a window that ends
            at or before it matches nothing rather than running all night.
        dishes:
          type: array
          items:
            type: string
          title: Dishes
          default: []
          description: What is served at this sitting, in the order it should read.
      type: object
      required:
      - slot
      - start_time
      - end_time
      title: MessMenuSlot
    MessMenuDay:
      properties:
        day:
          type: integer
          title: Day
          description: >-
            1-based fest day. The menu covers six; note that participants.mess.entries
            — the swipe grid — is seeded with five, so a day-6 scan has no slot to
            mark.
        slots:
          type: array
          items:
            $ref: '#/components/schemas/MessMenuSlot'
          title: Slots
          default: []
      type: object
      required:
      - day
      title: MessMenuDay
    MessMenuRequest:
      properties:
        days:
          type: array
          items:
            $ref: '#/components/schemas/MessMenuDay'
          title: Days
          default: []
          description: >-
            The whole menu, not a diff. `menu` on the hall document should be
            readable on its own by anything that fetches the hall, rather than a
            patch that only means something beside a copy of the published campus
            sheet. Sending an empty list withdraws the hall's menu and puts it back
            on the published sheet for everyone allotted there.
        note:
          anyOf:
          - type: string
          - type: 'null'
          title: Note
          description: A free line every participant eating at this hall reads.
      type: object
      title: MessMenuRequest
    ParticipantAdminUpdateRequest:
      properties:
        full_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Full Name
        house:
          anyOf:
          - type: string
          - type: 'null'
          title: House
        gender:
          anyOf:
          - type: string
          - type: 'null'
          title: Gender
          description: male | female | other
        phone:
          anyOf:
          - type: string
          - type: 'null'
          title: Phone
        mess_preference:
          anyOf:
          - type: string
          - type: 'null'
          title: Mess Preference
        country:
          anyOf:
          - type: string
          - type: 'null'
          title: Country
        state:
          anyOf:
          - type: string
          - type: 'null'
          title: State
        city:
          anyOf:
          - type: string
          - type: 'null'
          title: City
        address:
          anyOf:
          - type: string
          - type: 'null'
          title: Address
        program:
          anyOf:
          - type: string
          - type: 'null'
          title: Program
          description: DS | ES | AE | MS
        course_stage:
          anyOf:
          - type: string
          - type: 'null'
          title: Course Stage
          description: foundational | diploma | degree
        emergency_contact:
          anyOf:
          - $ref: '#/components/schemas/EmergencyContact'
          - type: 'null'
      type: object
      title: ParticipantAdminUpdateRequest
      description: >-
        Every field is optional and only the ones a request carries are written.
        Deliberately holds no email, participant_id, password, QR key, mess,
        accommodation, event or workshop field — see
        PATCH /participants/{participant_id}.
    PrizeMoney:
      properties:
        position:
          type: string
          title: Position
        amount:
          type: integer
          title: Amount
      type: object
      required:
      - position
      - amount
      title: PrizeMoney
    ProfileCompleteRequest:
      properties:
        full_name:
          type: string
          title: Full Name
        dob:
          type: string
          title: Dob
        house:
          type: string
          title: House
        gender:
          type: string
          title: Gender
        phone:
          type: string
          title: Phone
        mess_preference:
          anyOf:
          - type: string
          - type: 'null'
          title: Mess Preference
          default: South Indian
        country:
          type: string
          title: Country
        state:
          type: string
          title: State
        city:
          type: string
          title: City
        address:
          type: string
          title: Address
        emergency_contact:
          anyOf:
          - $ref: '#/components/schemas/EmergencyContact'
          - type: 'null'
        program:
          type: string
          title: Program
        course_stage:
          type: string
          title: Course Stage
        photo:
          anyOf:
          - type: string
          - type: 'null'
          title: Photo
        event_preferences:
          anyOf:
          - type: string
          - type: 'null'
          title: Event Preferences
      type: object
      required:
      - full_name
      - dob
      - house
      - gender
      - phone
      - country
      - state
      - city
      - address
      - program
      - course_stage
      title: ProfileCompleteRequest
    QueryCreateRequest:
      properties:
        category:
          type: string
          title: Category
          description: >-
            hostel | mess | event | workshop | general. This is what routes the
            query to a team, so it is validated rather than free text.
        subject:
          type: string
          minLength: 1
          title: Subject
        body:
          type: string
          minLength: 1
          title: Body
        target_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Target Id
          description: >-
            The readable hostel_id, mess_id, event_id, or workshop_id the query is
            about — never an ObjectId. Required for every category but general,
            where it is dropped rather than stored.
      type: object
      required:
      - category
      - subject
      - body
      title: QueryCreateRequest
    QueryReplyRequest:
      properties:
        body:
          type: string
          minLength: 1
          title: Body
      type: object
      required:
      - body
